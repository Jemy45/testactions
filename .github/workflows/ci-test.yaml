name: CI Test
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
       - name: 1. Checkout code
         uses: actions/checkout@v4
       - name: 2. Set up Python
         uses: actions/setup-python@v4
         with:
           python-version: '3.14'
       - name: 3. Install pytest tools
         run: |
           python -m pip install --upgrade pip
           pip install pytest
       - name: 4. Run Appliication 
         run: |
           python app.py
       - name: 5. Run tests
         run: |
           pytest test_app.py

          